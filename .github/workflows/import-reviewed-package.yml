name: Import reviewed study package

on:
  workflow_dispatch:
    inputs:
      archive_sha256:
        description: SHA256 of the sealed reviewed rc2 ZIP
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: import-reviewed-study-package
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'DrChambuso/ssi-precision-prevention' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Verify and import the sealed archive
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        run: python3 -I .github/scripts/import_reviewed_package.py
